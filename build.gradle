plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	compileOnly "maven.modrinth:iris:${project.iris_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

import org.gradle.internal.logging.text.StyledTextOutputFactory;
import static org.gradle.internal.logging.text.StyledTextOutput.Style;

jar {
	inputs.property "archivesName", project.base.archivesName
	version = null

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}

	// Human readable list of compiled native libraries that were found
	def natives = []

	// Host-specific native library (debug or release)
	def nativeExt = org.gradle.internal.os.OperatingSystem.current().isWindows() ? "dll" : "so"
	// NOTE: release MUST come before debug. Previously debug was listed first,
	// and the jar task packs the FIRST existing candidate — so a stale
	// `native/target/debug/waylandcraft.dll` left over from an old build
	// silently shadowed every fresh `cargo build --release`, shipping outdated
	// native code in the mod jar (fixes appeared to "do nothing" in-game).
	// Preferring release ensures the optimized, up-to-date library is packed.
	def nativeCandidates = [
		file("native/target/release/waylandcraft.${nativeExt}"),
		file("native/target/debug/waylandcraft.${nativeExt}"),
		file("native/target/release/libwaylandcraft.${nativeExt}"),
		file("native/target/debug/libwaylandcraft.${nativeExt}"),
	]
	for(def candidate in nativeCandidates) {
		if(candidate.exists()) {
			from(candidate)
			natives.add("host")
			break
		}
	}

	// Packaging of libraries in directory `native-libs`
	def targets = org.gradle.internal.os.OperatingSystem.current().isWindows()
		? [ "windows-gnu-x86_64" ]
		: [ "linux-gnu-x86_64", "linux-gnu-arm64" ];

	for(def target in targets) {
		def ext = target.startsWith("windows") ? "dll" : "so"
		def prefix = target.startsWith("windows") ? "" : "lib"
		def f = file("native-libs/${prefix}waylandcraft-${target}.${ext}")
		if(!f.exists()) continue;

		with(copySpec {
			from(f)
		})
		natives.add("${target}")
	}

	if(natives.size() < 1) {
		services
			.get(StyledTextOutputFactory)
			.create("waylandcraft")
			.withStyle(Style.Failure)
			.println("WARNING: Native library not built! The built mod will not contain native code");
	}
}

loom {
	runs {
		client {
			// Load the native library from the RELEASE build dir for runClient.
			// It used to point at `debug`, which meant `gradlew runClient` ran a
			// stale/unoptimized library while `cargo build --release` output was
			// ignored — exactly the mismatch that made code changes seem to do
			// nothing. Point it at `release` so runClient uses the same optimized
			// library that ships in the jar.
			if(org.gradle.internal.os.OperatingSystem.current().isLinux()) {
				environmentVariable("LD_LIBRARY_PATH", "../native/target/release/")
			}
			if(org.gradle.internal.os.OperatingSystem.current().isWindows()) {
				environmentVariable("PATH", "../native/target/release/;" + System.getenv("PATH"))
			}
			environmentVariable("__GL_THREADED_OPTIMIZATIONS", "0")
			environmentVariable("RUST_BACKTRACE", "1")
		}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
