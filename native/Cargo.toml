[package]
name = "waylandcraft"
version = "0.1.0"
edition = "2021"

[lib]
name = "waylandcraft"
crate-type = [ "cdylib" ]

[dependencies]
jni = "0.22.4"
thiserror = "2.0"
resvg = { version = "0.47.0", default-features = false, features = [ "text", "memmap-fonts" ] }
shlex = "1.3.0"

[target.'cfg(target_os = "linux")'.dependencies]
smithay = { git = "https://github.com/Smithay/smithay.git", rev = "89e58f7", default-features = false, features = [ "wayland_frontend", "backend_drm" ] }
libc = { version = "0.2.176", default-features = false }
xkbcommon = "0.8.0"
cosmic-freedesktop-icons = { git = "https://github.com/pop-os/freedesktop-icons.git", rev = "7a61a70" }
freedesktop-desktop-entry = "0.8.1"
rustix = { version = "1.1.3", features = [ "fs", "process" ] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp",

    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",

    "Win32_UI_Shell",

    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Console",

    # --- Windows Graphics Capture (WGC) GPU-accurate window capture ---
    # WGC snapshots what a window REALLY renders on the GPU (DirectComposition /
    # DirectX swap-chains), which GDI PrintWindow cannot — this is what makes
    # Discord/Opera/Electron and DirectX games capture correctly instead of
    # showing a black or frozen frame.
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Foundation",
    "Foundation_Metadata",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
] }


walkdir = "2.5"

